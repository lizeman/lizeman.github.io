name: scholar-sync

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch: {}    # allow manual trigger

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Read author IDs from _config.yml
        id: ids
        run: |
          ss=$(python -c "import yaml; print(yaml.safe_load(open('_config.yml'))['semantic_scholar_author_id'])")
          gs=$(python -c "import yaml; print(yaml.safe_load(open('_config.yml'))['scholar_id'])")
          echo "ss_id=$ss" >> "$GITHUB_OUTPUT"
          echo "gs_id=$gs" >> "$GITHUB_OUTPUT"
          echo "Semantic Scholar id=$ss, Google Scholar id=$gs"

      - name: Fetch publications + coauthors (Semantic Scholar)
        env:
          SEMANTIC_SCHOLAR_AUTHOR_ID: ${{ steps.ids.outputs.ss_id }}
          SCHOLAR_ID: ${{ steps.ids.outputs.gs_id }}
        run: python scripts/fetch_scholar.py

      - name: Show changes (for the workflow log)
        run: |
          echo "::group::diff"
          git diff --stat _data/publications.yml _data/coauthors.yml || true
          echo "::endgroup::"

      - name: Job summary
        run: |
          {
            echo "## scholar-sync"
            if git diff --quiet _data/publications.yml _data/coauthors.yml; then
              echo "**No changes** to publications.yml / coauthors.yml — nothing to commit."
            else
              echo "**Changes detected** — committing:"
              echo ""
              echo '```diff'
              git diff --stat _data/publications.yml _data/coauthors.yml
              echo '```'
            fi
            echo ""
            echo "Publications: $(grep -c '^- title:' _data/publications.yml)"
            echo "Coauthors: $(grep -cE "^'[0-9]+':$" _data/coauthors.yml) cached"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if there are changes
        run: |
          if git diff --quiet _data/publications.yml _data/coauthors.yml; then
            echo "No changes to publications.yml or coauthors.yml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml _data/coauthors.yml
          git commit -m "chore: scholar sync"
          git push
