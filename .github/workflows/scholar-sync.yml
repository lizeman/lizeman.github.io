name: scholar-sync

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications (Semantic Scholar API)
        env:
          SEMANTIC_SCHOLAR_AUTHOR_ID: "2000315380"
        run: python scripts/fetch_scholar.py

      - name: Commit changes if any
        run: |
          if git diff --quiet _data/publications.yml; then
            echo "No changes to publications.yml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "chore: scholar sync"
          git push
