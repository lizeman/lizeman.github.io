name: build-check

# Sanity-checks every push to main:
#  - Jekyll site builds without errors (using the github-pages gem)
#  - publication YAML is parseable and shape-correct (full-name authors)
#  - the homepage actually contains the expected anchors after build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Opt into Node 24 early so checkout@v4 / setup-python@v5 stop
  # warning about Node 20 deprecation. GitHub will force this by
  # June 2026 anyway.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Syntax-check all JS files
        run: |
          for f in assets/js/*.js; do
            node --check "$f" || { echo "JS syntax error in $f"; exit 1; }
          done
          echo "OK — all JS files parse"

      - name: Verify built homepage has anchors and game pages exist
        run: |
          set -e
          test -f _site/index.html
          for anchor in 'id="bio"' 'id="news"' 'id="publications"' 'id="vita"'; do
            grep -q "$anchor" _site/index.html || { echo "missing $anchor"; exit 1; }
          done
          test -f _site/portal/index.html
          test -f _site/typing/index.html
          test -f _site/beaver/index.html
          test -f _site/buffalo/index.html
          test -f _site/roulette/index.html
          test -f _site/assets/js/roulette.js
          grep -q "Roulette" _site/roulette/index.html
          grep -q "Martingale" _site/roulette/index.html
          grep -q "Labouch" _site/roulette/index.html
          grep -q "rou-wheel" _site/roulette/index.html
          grep -qi "peak profit" _site/roulette/index.html
          grep -q "auto-bet" _site/roulette/index.html
          grep -qi "monte carlo\|aggregate" _site/roulette/index.html
          grep -q "prefers-reduced-motion" _site/assets/js/roulette.js
          grep -qi "buffalo buffalo" _site/buffalo/index.html
          grep -q "auto-grow" _site/buffalo/index.html
          grep -q "Busy Beaver" _site/beaver/index.html
          grep -q "state diagram" _site/beaver/index.html
          grep -q "mini-map" _site/beaver/index.html
          grep -q "WPM" _site/typing/index.html
          grep -q "personal best" _site/typing/index.html
          grep -qi ">mode<\|length<" _site/typing/index.html
          grep -q "Visiting from" _site/index.html
          grep -q "ipapi.co" _site/index.html
          grep -q "prefers-reduced-motion" _site/assets/css/main.css
          test -f _site/404.html || { echo "missing _site/404.html"; exit 1; }
          grep -q "wandered off" _site/404.html || { echo "missing 404 copy"; exit 1; }
          grep -q 'application/ld+json' _site/index.html || { echo "missing JSON-LD block"; exit 1; }
          grep -q '"@type": "Person"' _site/index.html || { echo "missing Person schema"; exit 1; }
          grep -q "zemanli_picture.jpg" _site/index.html || { echo "missing profile img reference"; exit 1; }
          grep -q 'rel="icon"' _site/index.html || { echo "missing favicon link"; exit 1; }
          grep -q 'rel="apple-touch-icon"' _site/index.html || { echo "missing apple-touch-icon"; exit 1; }
          grep -q 'property="og:image"' _site/index.html || { echo "missing og:image meta"; exit 1; }
          test -f _site/sitemap.xml || { echo "missing sitemap.xml — jekyll-sitemap not building"; exit 1; }
          grep -q "<loc>" _site/sitemap.xml || { echo "sitemap.xml has no <loc> entries"; exit 1; }
          test -f _site/robots.txt || { echo "missing robots.txt"; exit 1; }
          grep -q "Sitemap:" _site/robots.txt || { echo "robots.txt missing Sitemap line"; exit 1; }
          grep -q "skip-link" _site/index.html || { echo "missing skip-to-content link"; exit 1; }
          grep -q "@media print" _site/assets/css/main.css || { echo "missing print stylesheet"; exit 1; }
          ! grep -Eq "[0-9]+ citation" _site/index.html || { echo "publications still show citation count"; exit 1; }
          ! grep -q "/404.html" _site/sitemap.xml || { echo "404 leaked into sitemap"; exit 1; }
          for path in /portal/ /typing/ /beaver/ /buffalo/ /roulette/; do
            ! grep -q "$path" _site/sitemap.xml || { echo "noindex page $path leaked into sitemap"; exit 1; }
          done
          grep -q "ItemList" _site/index.html || { echo "missing publications ItemList JSON-LD"; exit 1; }
          grep -q "ScholarlyArticle" _site/index.html || { echo "missing ScholarlyArticle JSON-LD"; exit 1; }
          grep -q 'name="theme-color"' _site/index.html || { echo "missing theme-color meta"; exit 1; }
          grep -q 'aria-label="Section navigation"' _site/index.html || { echo "missing nav aria-label"; exit 1; }
          grep -q "visually-hidden" _site/assets/css/main.css || { echo "missing .visually-hidden helper"; exit 1; }
          grep -q 'class="pub-fresh"' _site/index.html || { echo "missing pub-fresh timestamp"; exit 1; }
          grep -q '<time datetime=' _site/index.html || { echo "missing semantic <time> markup"; exit 1; }
          # news dates should parse to YYYY-MM (e.g. "Nov 2025" → 2025-11)
          grep -Eq '<time class="cv-when" datetime="[0-9]{4}-[0-9]{2}">' _site/index.html || { echo "news month-name parser broke (no YYYY-MM datetime found)"; exit 1; }
          grep -q 'rel="preload" as="image"' _site/index.html || { echo "missing profile-img preload on homepage"; exit 1; }
          # game pages should NOT have the homepage-only preload
          ! grep -q 'rel="preload" as="image"' _site/roulette/index.html || { echo "preload leaked onto game page"; exit 1; }
          test -f _site/assets/img/zemanli_picture_600.webp || { echo "missing 600px WebP variant"; exit 1; }
          test -f _site/assets/img/zemanli_picture_600.jpg || { echo "missing 600px JPG variant"; exit 1; }
          test -f _site/assets/img/apple-touch-icon.png || { echo "missing apple-touch-icon PNG"; exit 1; }
          grep -q "apple-touch-icon.png" _site/index.html || { echo "homepage not pointing at the dedicated apple-touch-icon"; exit 1; }
          test -f _site/publications.xml || { echo "missing publications.xml feed"; exit 1; }
          grep -q "publications.xml" _site/index.html || { echo "homepage missing alternate publications feed link"; exit 1; }
          test -f _site/humans.txt || { echo "missing humans.txt"; exit 1; }
          grep -q "Owner: Zeman Li" _site/humans.txt || { echo "humans.txt corrupted"; exit 1; }
          test -f _site/manifest.json || { echo "missing manifest.json"; exit 1; }
          python -c "import json; json.load(open('_site/manifest.json'))" || { echo "manifest.json invalid JSON"; exit 1; }
          grep -q 'rel="manifest"' _site/index.html || { echo "homepage missing manifest link"; exit 1; }
          grep -q '<picture>' _site/index.html || { echo "homepage missing <picture> element"; exit 1; }
          grep -q 'type="image/webp"' _site/index.html || { echo "homepage missing webp source"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Smoke-test build_image_variants.py (Pillow API compat)
        run: |
          # Run the script and verify it produces all three variants
          # at expected file sizes. Catches Pillow version drift +
          # source-image deletion.
          python scripts/build_image_variants.py
          test -f assets/img/zemanli_picture_600.webp
          test -f assets/img/zemanli_picture_600.jpg
          test -f assets/img/apple-touch-icon.png
          # all three should be non-trivial (>10 KB)
          for f in assets/img/zemanli_picture_600.webp assets/img/zemanli_picture_600.jpg assets/img/apple-touch-icon.png; do
            sz=$(wc -c < "$f")
            [ "$sz" -gt 10000 ] || { echo "$f suspiciously small ($sz B)"; exit 1; }
          done

      - name: Unit-test fetch_scholar dedup + venue-year extraction
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          import fetch_scholar as fs

          # _dedup_papers: two records describing the same paper (same
          # author-id set), one with arxiv, the other without — should
          # keep the arxiv one.
          a = {"authors": [{"authorId": "1"}, {"authorId": "2"}], "externalIds": {}, "citationCount": 5, "year": 2025}
          b = {"authors": [{"authorId": "2"}, {"authorId": "1"}], "externalIds": {"ArXiv": "2511.99999"}, "citationCount": 3, "year": 2025}
          out = fs._dedup_papers([a, b])
          assert len(out) == 1, f"expected dedup to 1, got {len(out)}"
          assert out[0]["externalIds"].get("ArXiv") == "2511.99999", "arxiv variant should win"

          # records with no author IDs pass through untouched
          c = {"authors": [], "externalIds": {}, "citationCount": 0, "year": 2024}
          d = {"authors": [], "externalIds": {}, "citationCount": 0, "year": 2024}
          out = fs._dedup_papers([c, d])
          assert len(out) == 2, "no-author-id records must not collapse"

          # build_publications: venue override picks year out of "ICLR 2026"
          paper = {
            "title": "Test paper", "year": 2025, "authors": [{"authorId": "X", "name": "Self"}],
            "externalIds": {"ArXiv": "2511.12345"}, "venue": "Preprint",
            "publicationVenue": {}, "url": "",
          }
          pubs = fs.build_publications(
            [paper],
            coauthors={"X": {"name": "Zeman Li", "url": ""}},
            venue_overrides={"2511.12345": "ICLR 2026 (Spotlight)"},
            self_id="X",
          )
          assert len(pubs) == 1
          assert pubs[0]["venue"] == "ICLR 2026 (Spotlight)"
          assert pubs[0]["year"] == "2026", f"venue-year should be 2026, got {pubs[0]['year']}"
          print("OK — fetch_scholar unit tests passed.")
          PY

      - name: Validate _data shapes
        run: |
          python - <<'PY'
          import yaml, pathlib, re

          # publications.yml — auto-generated, full-name authors, self flag
          d = yaml.safe_load(pathlib.Path("_data/publications.yml").read_text())
          assert isinstance(d, list) and d, "publications.yml empty"
          for p in d:
              assert "title" in p and p["title"], "missing title"
              assert isinstance(p.get("authors"), list), f"authors not list: {p['title']}"
              assert any(" " in (a.get("name") or "") for a in p["authors"]), \
                  f"no full-name author in {p['title']}"
              assert any(a.get("is_self") for a in p["authors"]), \
                  f"no is_self author in {p['title']}"
          print(f"OK — {len(d)} publications validated.")

          # news.yml — hand-edited; date + text required + reverse-chrono order
          n = yaml.safe_load(pathlib.Path("_data/news.yml").read_text())
          assert isinstance(n, list) and n, "news.yml empty"
          MONTHS = {m: i + 1 for i, m in enumerate(
              "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split()
          )}
          def _key(item):
              parts = (item.get("date") or "").split()
              if len(parts) != 2:
                  return (0, 0)
              return (int(parts[1]) if parts[1].isdigit() else 0,
                      MONTHS.get(parts[0], 0))
          last_key = (10000, 13)  # sentinel newer than any real date
          for item in n:
              assert isinstance(item, dict), f"news entry not dict: {item}"
              assert item.get("date"), f"news entry missing date: {item}"
              assert item.get("text"), f"news entry missing text: {item}"
              k = _key(item)
              assert k <= last_key, \
                  f"news.yml not in reverse-chrono order: {item.get('date')} > {last_key}"
              last_key = k
          print(f"OK — {len(n)} news items validated, reverse-chrono.")

          # cv.yml — education + awards
          cv = yaml.safe_load(pathlib.Path("_data/cv.yml").read_text())
          assert isinstance(cv, dict), "cv.yml not a dict"
          last_ed_start = 9999
          for ed in cv.get("education", []):
              assert ed.get("degree"), f"education entry missing degree: {ed}"
              assert ed.get("school"), f"education entry missing school: {ed}"
              assert ed.get("years"), f"education entry missing years: {ed}"
              # Pull the leading year out of "2023 – present" style strings
              ms = re.search(r"\b(20\d{2})\b", str(ed["years"]))
              if ms:
                  start = int(ms.group(1))
                  assert start <= last_ed_start, \
                      f"education out of reverse-chrono order: {ed['years']} > {last_ed_start}"
                  last_ed_start = start
          last_award_year = 9999
          for a in cv.get("awards", []):
              assert a.get("year"), f"award missing year: {a}"
              assert a.get("text"), f"award missing text: {a}"
              y = int(str(a["year"]))
              assert y <= last_award_year, \
                  f"awards out of reverse-chrono order: {a['year']} > {last_award_year}"
              last_award_year = y
          print(
              f"OK — cv.yml: {len(cv.get('education', []))} education, "
              f"{len(cv.get('awards', []))} awards"
          )

          # coauthors.yml — auto-generated cache; verify shape so a bad
          # fetch_scholar run can't silently poison the next sync.
          ca = yaml.safe_load(pathlib.Path("_data/coauthors.yml").read_text())
          assert isinstance(ca, dict), "coauthors.yml not a dict"
          for aid, info in ca.items():
              assert isinstance(info, dict), f"coauthor {aid} not a dict"
              assert "name" in info, f"coauthor {aid} missing name"
              assert "url" in info, f"coauthor {aid} missing url"
          print(f"OK — coauthors.yml: {len(ca)} cached coauthors")

          # venue_overrides.yml — hand-edited arxiv-id → venue map.
          # Both new-style (NNNN.NNNNN) and old-style (subj/NNNNNNN) ids
          # are accepted; the value must be a non-empty string.
          vo = yaml.safe_load(pathlib.Path("_data/venue_overrides.yml").read_text())
          assert isinstance(vo, dict), "venue_overrides.yml not a dict"
          for k, v in vo.items():
              ks = str(k)
              ok_new = re.match(r"^[0-9]{4}\.[0-9]{4,6}$", ks)
              ok_old = re.match(r"^[a-z-]+/[0-9]{7}$", ks)
              assert ok_new or ok_old, \
                  f"venue_overrides key {ks!r} doesn't look like an arxiv id"
              assert isinstance(v, str) and v.strip(), \
                  f"venue_overrides[{ks}] empty or not a string"
          print(f"OK — venue_overrides.yml: {len(vo)} entries")
          PY

      - name: Validate JSON-LD blocks parse + no duplicate IDs + Atom feed
        run: |
          python - <<'PY'
          import json, re, pathlib, collections
          import xml.etree.ElementTree as ET

          html = pathlib.Path("_site/index.html").read_text()
          blocks = re.findall(
              r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>',
              html, flags=re.DOTALL,
          )
          assert len(blocks) >= 2, f"expected ≥2 JSON-LD blocks, got {len(blocks)}"
          for i, raw in enumerate(blocks):
              try:
                  obj = json.loads(raw)
              except json.JSONDecodeError as e:
                  print(f"--- block {i} ---\n{raw[:400]}\n---")
                  raise
              assert "@type" in obj, f"block {i}: no @type"
          # duplicate-id check. Negative lookbehind so data-id= /
          # aria-labelledby="id-foo" / etc don't match as `id=` attrs.
          ids = re.findall(r'(?<![a-zA-Z-])id="([^"]+)"', html)
          dupes = [k for k, v in collections.Counter(ids).items() if v > 1]
          assert not dupes, f"duplicate id attrs in homepage: {dupes}"
          print(f"OK — {len(blocks)} JSON-LD blocks parsed; {len(ids)} ids unique.")

          # Atom feed parses + has at least 1 entry
          feed = pathlib.Path("_site/publications.xml").read_text()
          root = ET.fromstring(feed)
          ns = {"a": "http://www.w3.org/2005/Atom"}
          entries = root.findall("a:entry", ns)
          assert len(entries) >= 1, "publications.xml has no <entry> elements"
          for e in entries:
              assert e.find("a:title", ns) is not None, "entry missing title"
              assert e.find("a:author/a:name", ns) is not None, "entry missing author/name"
              assert e.find("a:id", ns) is not None, "entry missing id"
          print(f"OK — publications.xml has {len(entries)} valid entries.")
          PY
