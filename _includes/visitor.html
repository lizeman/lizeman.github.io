<aside class="visitor" aria-label="Visitor info" data-goatcounter-code="{{ site.goatcounter_code | default: '' }}">
  <span class="visitor-line">
    <span class="dot" aria-hidden="true"></span>
    <span class="visitor-from">Visiting from <span data-visitor-city>somewhere on the internet</span></span>
    <span class="sep" aria-hidden="true">·</span>
    <span>your visit <span data-visitor-count>#1</span></span>
    <span class="sep" aria-hidden="true">·</span>
    <span>site visits <span data-visitor-total>—</span></span>
  </span>
  <p class="visitor-fine">
    City inferred client-side via
    <a href="https://ipapi.co" rel="noopener" target="_blank">ipapi.co</a>;
    nothing is logged on this site. Aggregate counts via
    <a href="https://www.goatcounter.com" rel="noopener" target="_blank">GoatCounter</a> &mdash;
    no cookies, no IPs.
  </p>
</aside>
<script>/* visitor widget bootstrap — full logic lives in site.js; uses ipapi.co for client-side geo */</script>
