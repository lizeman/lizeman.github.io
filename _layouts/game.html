<!doctype html>
<html lang="en">
<head>
  {%- include head.html -%}
</head>
<body class="game game-{{ page.game | default: 'generic' }}">
  <div class="grain" aria-hidden="true"></div>
  <main class="page">
    <a class="game-back" href="{{ '/' | relative_url }}">&larr; back to home</a>
    <noscript>
      <p style="padding:1rem;border:1px dashed #ccc;border-radius:6px;color:#666;font-family:sans-serif;font-size:0.9rem;">
        This page is an interactive game and needs JavaScript to run.
        It’ll load fine if you re-enable JS for this site.
      </p>
    </noscript>
    {{ content }}
    <footer class="site-footer">
      <p class="meta">a hidden page · &copy; Zeman Li</p>
    </footer>
  </main>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- if page.game_script -%}
    <script src="{{ page.game_script | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- endif -%}
</body>
</html>
